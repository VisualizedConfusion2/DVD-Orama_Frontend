<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="Stylesheet.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <div class="topbar">
            <div class="brand" style="cursor:pointer;" @click="goHome">DVD-Orama</div>

            <!-- Logged in: show username + separate sign out button -->
            <div v-if="UserName" class="topbar-actions">
                <button class="signin-btn" type="button" @click="openSettings">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"></path>
                    </svg>
                    {{ UserName }}
                </button>
                <button class="signin-btn signout-btn" type="button" @click="redirectToLogin">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    sign out
                </button>
            </div>
            <!-- Not logged in: single sign in button -->
            <button v-else class="signin-btn" type="button" @click="redirectToLogin">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"></path>
                </svg>
                sign in
            </button>
        </div>

        <h2 style="text-align:center;">Movies with {{ actorName }}</h2>

        <p v-if="loading" style="text-align:center; color:#c9a84c;">Loading movies...</p>
        <table v-else>
            <thead>
                <tr>
                    <th>Poster</th>
                    <th>Title</th>
                    <th>Release Year</th>
                    <th>Duration</th>
                    <th>Find</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(movie, index) in movies" :key="index">
                    <td><img :src="movie.posterUrl" :alt="movie.title" width="80" /></td>
                    <td>{{ movie.title }}</td>
                    <td>{{ movie.publicationYear }}</td>
                    <td>{{ movie.duration }} minutes</td>
                    <td>
                        <button type="button" class="btn btn-primary btn-sm" data-toggle="modal"
                            data-target="#movieModal" :data-title="movie.title"
                            :data-year="movie.publicationYear" :data-duration="movie.duration"
                            :data-poster="movie.posterUrl"
                            :data-streaming="JSON.stringify(movie.streamingLocations)"
                            :data-actors="JSON.stringify(movie.actors)">
                            Find Movie
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div><!-- end #app -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="Actor.js"></script>


</body>
</html>
