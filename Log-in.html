<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — DVD-Orama</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
    <link rel="stylesheet" href="Stylesheet.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <div class="container mt-5" style="max-width:420px">
            <h1 class="mb-4">Sign In</h1>
            <div class="form-group">
                <label>Email</label>
                <input v-model="email" type="email" class="form-control" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input v-model="password" type="password" class="form-control" placeholder="Password">
            </div>
            <p v-if="error" class="text-danger">{{ error }}</p>
            <button @click="loginEmail" class="btn btn-primary btn-block mb-2">Sign In</button>
            <hr>
            <button @click="loginGoogle" class="google-btn">
              <svg class="google-btn__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Sign in with Google
            </button>
            <p class="mt-3 text-center">
                No account? <a href="Register.html">Register</a>
            </p>
            <p class="text-center">
                <a href="#" @click.prevent="showForgotPassword = true">Glemt password?</a>
            </p>
        </div>

        <!-- Modal is inside #app so Vue can control it -->
        <div v-if="showForgotPassword" class="modal-backdrop" @click.self="showForgotPassword = false">
            <div class="modal-box">
                <h5>Nulstil password</h5>
                <p style="font-size:0.9rem; color:var(--film-silver)">Indtast din e-mail — vi sender dig et link.</p>
                <div class="form-group">
                    <input v-model="resetEmail" type="email" class="form-control" placeholder="din@email.dk">
                </div>
                <p v-if="resetMsg" :class="resetError ? 'text-danger' : 'text-success'">{{ resetMsg }}</p>
                <button @click="sendReset" class="btn btn-primary btn-block">Send reset-link</button>
                <button @click="showForgotPassword = false" class="btn btn-block mt-2" style="background:transparent;color:var(--film-silver);border:1px solid rgba(200,192,180,0.3)">Annuller</button>
            </div>
        </div>
    </div>

    <script type="module" src="Log-in.js"></script>
</body>

</html>
