<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyt password — DVD-Orama</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="Stylesheet.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app" class="container mt-5" style="max-width:420px">
        <h1 class="mb-4">Nyt password</h1>

        <div v-if="invalid">
            <p class="text-danger">Dette reset-link er ugyldigt eller udløbet.</p>
            <a href="Log-in.html" class="btn btn-primary">Tilbage til login</a>
        </div>

        <div v-else-if="done">
            <p class="text-success">Password opdateret! Du er nu logget ind.</p>
        </div>

        <div v-else>
            <div class="form-group">
                <label>Nyt password</label>
                <input v-model="newPassword" type="password" class="form-control" placeholder="Min. 6 tegn">
            </div>
            <p v-if="error" class="text-danger">{{ error }}</p>
            <button @click="resetPassword" class="btn btn-primary btn-block" :disabled="loading">
                {{ loading ? 'Gemmer…' : 'Gem nyt password' }}
            </button>
        </div>
    </div>

    <script type="module" src="Reset-password.js"></script>
</body>

</html>
