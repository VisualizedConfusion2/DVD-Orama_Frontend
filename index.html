<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD-Orama</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="Stylesheet.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">
        DVD-Orama
      </div>
      <button class="signin-btn" type="button" @click="redirectToLogin">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"></path>
        </svg>
        sign in
      </button>
    </div>
    <h2 v-if="UserName == null">Welcome, Guest</h2>
    <h2 v-else>Welcome, {{ UserName }}</h2>
    <button v-on:click="UserName = 'John Doe'">Set UserName</button>
    <h3><ImageDisplay src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTERfmV8fgdV4aHIzg9N065NmQWVXAQqbKNmQ&s" /></h3>
    <table>
      <thead>
        <tr>
          <th>Poster</th>
          <th>Title</th>
          <th>Release Year</th>
          <th>Duration</th>
          <th>Find</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(movie, index) in movies" :key="index">
          <td><ImageDisplay src="{{ movie.posterURL }}" /></td>
          <td>{{ movie.title }}</td>
          <td>{{ movie.publicationYear }}</td>
          <td>{{ movie.duration }}</td>
          <td><button class="btn-primary" data-toggle="modal" data-target="#movieModal">Find Movie</button>
            <div class="modal fade" id="movieModal" tabindex="-1" role="dialog" aria-labelledby="movieModalLabel" aria-hidden="true">
              <div class="modal-dialog" role="document">
                <div class="modal-content">
                  <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                      <span aria-hidden="true">&times;</span>
                    </button>
                  </div>
                  <div class="modal-body">
                      <p>Some text in the modal.</p>
                  </div>
                    <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                  </div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

<script src="index.js"></script>
<script setup>
import ImageDisplay from '@/components/ImageDisplay.vue'
</script>
</body>
</html>
