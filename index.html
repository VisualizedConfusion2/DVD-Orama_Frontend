<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD-Orama</title>
  <!-- Bootstrap 4.5.2 CSS — switched to jsDelivr to fix source map error -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="Stylesheet.css">
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">
        DVD-Orama
      </div>
      <button class="signin-btn" type="button" @click="redirectToLogin">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"></path>
        </svg>
        sign in
      </button>
    </div>

    <h2 v-if="UserName == null">Welcome, Guest</h2>
    <h2 v-else>Welcome, {{ UserName }}</h2>
    <button v-on:click="UserName = 'John Doe'">Set UserName</button>
    <!-- <h3><ImageDisplay src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTERfmV8fgdV4aHIzg9N065NmQWVXAQqbKNmQ&s" /></h3> -->
<!-- Search Bar -->
<div class="search-container">
  <select v-model="selectedGenre" class="filter-select">
    <option value="">All Genres</option>
    <option v-for="genre in genres" :key="genre.id" :value="genre.name">
      {{ genre.name }}
    </option>
  </select>

  <select v-model="selectedService" class="filter-select">
    <option value="">All Services</option>
    <option v-for="service in streamingServices" :key="service" :value="service">
      {{ service }}
    </option>
  </select>

  <div class="search-box">
    <input
      type="text"
      v-model="searchTitle"
      class="search-input"
      placeholder="Search by title..."
      @keyup.enter="searchMovies"
    />
    <button class="search-btn" @click="searchMovies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </div>

  <button class="clear-btn" v-if="isSearching" @click="clearSearch">
    ✕ clear
  </button>
</div>
    <table>
      <thead>
        <tr>
          <th>Poster</th>
          <th>Title</th>
          <th>Release Year</th>
          <th>Duration</th>
          <th>Find</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(movie, index) in movies" :key="index">
          <td><img :src="movie.posterUrl" :alt="movie.title" width="80" /></td>
          <td>{{ movie.title }}</td>
          <td>{{ movie.publicationYear }}</td>
          <td>{{ movie.duration }} minutes</td>
          <td>
            <!-- Bootstrap 4 uses data-toggle / data-target (no "bs-" prefix) -->
            <button type="button" class="btn btn-primary btn-sm" data-toggle="modal" data-target="#movieModal"
              :data-title="movie.title" :data-year="movie.publicationYear" :data-duration="movie.duration"
              :data-poster="movie.posterUrl">
              Find Movie
            </button>
          </td>
        </tr>
      </tbody>
    </table>

  </div><!-- end #app -->
  <!-- ✅ Modal is now OUTSIDE the <table> so the DOM stays valid -->
  <div class="modal fade" id="movieModal" tabindex="-1" role="dialog" aria-labelledby="movieModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content" style="background-color:#1a0a0a; border:1px solid #c9a84c; color:#f0e8d5;">
        <div class="modal-header" style="border-bottom:1px solid rgba(201,168,76,0.3);">
          <h5 class="modal-title" id="movieModalLabel"
            style="font-family:'Josefin Sans',sans-serif; letter-spacing:0.15em; text-transform:uppercase; color:#c9a84c;">
            Movie Details
          </h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="color:#c9a84c; opacity:1;">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" style="font-family:'Cormorant Garamond',serif; font-size:1.1rem;">
          <img id="modal-poster-img" src="" alt="" width="120" style="display:block; margin-bottom:1rem;" />
          <p><strong style="color:#c9a84c;">Title:</strong> <span id="modal-title"></span></p>
          <p><strong style="color:#c9a84c;">Release Year:</strong> <span id="modal-year"></span></p>
          <p><strong style="color:#c9a84c;">Duration:</strong> <span id="modal-duration"></span> minutes</p>
          <p><strong style="color:#c9a84c;">Poster URL:</strong> <span id="modal-poster"></span></p>
        </div>
        <div class="modal-footer" style="border-top:1px solid rgba(201,168,76,0.3);">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>

  <!-- Bootstrap 4 JS bundle (includes Popper) — required for modals to work -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- <script setup> import ImageDisplay from '@/components/ImageDisplay.vue'</script> -->

  <script src="index.js"></script>

  <!-- Populate modal with the clicked row's data before it opens -->
  <script>
    $('#movieModal').on('show.bs.modal', function (event) {
      var button = $(event.relatedTarget);
      document.getElementById('modal-title').textContent = button.data('title') || '—';
      document.getElementById('modal-year').textContent = button.data('year') || '—';
      document.getElementById('modal-duration').textContent = button.data('duration') || '—';
      document.getElementById('modal-poster').textContent = button.data('poster') || '—';
      document.getElementById('modal-poster-img').src = button.data('poster') || '';
    });
  </script>

</body>

</html>
