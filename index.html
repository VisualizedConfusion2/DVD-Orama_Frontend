<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD-Orama</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="Stylesheet.css">
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">
        <a href="/index.html">
          DVD-Orama
        </a>
      </div>

      <!-- Logged in: show username + separate sign out button -->
      <div v-if="UserName" class="topbar-actions">
        <a href="/myCollections.html" class="signin-btn" type="button">
          My Collections
        </a>
        <button class="signin-btn" type="button" @click="openSettings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"></path>
          </svg>
          {{ UserName }}
        </button>
        <button class="signin-btn signout-btn" type="button" @click="redirectToLogin">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          sign out
        </button>
      </div>
      <!-- Not logged in: single sign in button -->
      <button v-else class="signin-btn" type="button" @click="redirectToLogin">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"></path>
        </svg>
        sign in
      </button>
    </div>

    <h2 v-if="UserName == null">Welcome, Guest</h2>
    <h2 v-else>Welcome, {{ UserName }}</h2>
<!-- Search Bar -->


    <!-- Search Bar -->
    <div class="search-container">
      <input type="number" v-model.number="selectedYear" class="year-input" placeholder="Year" min="1888" max="2026"
        @keyup.enter="searchMovies" />

      <select v-model="selectedGenre" class="filter-select">
        <option value="">All Genres</option>
        <option v-for="genre in genres" :key="genre.id" :value="genre.name">
          {{ genre.name }}
        </option>
      </select>

      <select v-model="selectedService" class="filter-select">
        <option value="">All Services</option>
        <option v-for="service in streamingServices" :key="service" :value="service">
          {{ service }}
        </option>
      </select>

      <div class="search-box">
        <input type="text" v-model="searchTitle" class="search-input" placeholder="Search by title..."
          @keyup.enter="searchMovies" @input="onTitleInput" @keydown="onSuggestionKeydown" @blur="hideSuggestions"
          autocomplete="off" />
        <button class="search-btn" @click="searchMovies">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Suggestions dropdown -->
        <ul v-if="suggestions.length > 0" class="suggestions-dropdown">
          <li v-for="(s, i) in suggestions" :key="i"
            :class="['suggestion-item', { active: i === activeSuggestion }]"
            @mousedown.prevent="selectSuggestion(s)">
            <span>{{ s }}</span>
          </li>
        </ul>
      </div>

      <!-- Single clear button inside search-container -->
      <button class="clear-btn" v-if="isSearching" @click="clearSearch">✕ clear</button>
    </div><!-- end search-container -->

    <!-- Did you mean -->
    <div v-if="didYouMean.length > 0" class="did-you-mean">
      <span>Did you mean: </span>
      <span v-for="s in didYouMean" :key="s" class="suggestion-chip"
        @click="searchTitle = s; didYouMean = []; searchMovies()">
        {{ s }}
      </span>
    </div>

    <p v-if="loading" style="text-align:center; color:#c9a84c;">Loading movies...</p>
    <table v-else>
      <thead>
        <tr>
          <th>Poster</th>
          <th>Title</th>
          <th>Release Year</th>
          <th>Duration</th>
          <th>Find</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(movie, index) in movies" :key="index">
          <td><img :src="movie.posterUrl" :alt="movie.title" width="80" /></td>
          <td>{{ movie.title }}</td>
          <td>{{ movie.publicationYear }}</td>
          <td>{{ movie.duration }} minutes</td>
          <td>
            <!-- Bootstrap 4 uses data-toggle / data-target (no "bs-" prefix) -->
            <button type="button" class="btn btn-primary btn-sm" data-toggle="modal" data-target="#movieModal"
              :data-title="movie.title" :data-year="movie.publicationYear" :data-duration="movie.duration"
              :data-poster="movie.posterUrl" :data-streaming="JSON.stringify(movie.streamingLocations)"
              :data-actors="JSON.stringify(movie.actors)">
              Find Movie
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- User Settings Modal -->
    <!-- User Settings Modal — stays inside #app so Vue controls it -->
    <div v-if="showSettings" class="modal-backdrop" @click.self="showSettings = false">
      <div class="modal-box" style="max-width:460px">
        <h5 class="mb-4">Brugerindstillinger</h5>

        <div class="form-group">
          <label>Brugernavn</label>
          <input v-model="settingsUsername" type="text" class="form-control">
        </div>

        <div class="form-group">
          <label>E-mail</label>
          <input v-model="settingsEmail" type="email" class="form-control">
        </div>

        <hr>

        <div class="form-group">
          <label>Nyt password <span style="color:var(--film-silver);font-size:0.75rem">(lad stå tomt for at beholde
              nuværende)</span></label>
          <input v-model="settingsNewPassword" type="password" class="form-control" placeholder="Nyt password">
        </div>

        <div class="form-group">
          <label>Nuværende password <span style="color:var(--film-silver);font-size:0.75rem">(kræves ved ændring af
              email eller password)</span></label>
          <input v-model="settingsCurrentPassword" type="password" class="form-control"
            placeholder="Dit nuværende password">
        </div>

        <p v-if="settingsError" class="text-danger">{{ settingsError }}</p>
        <p v-if="settingsSuccess" class="text-success">{{ settingsSuccess }}</p>

        <div style="display:flex;gap:0.75rem;margin-top:1rem">
          <button @click="saveSettings" class="btn btn-primary" :disabled="settingsSaving">
            {{ settingsSaving ? 'Gemmer…' : 'Gem ændringer' }}
          </button>
          <button @click="showSettings = false" class="btn"
            style="background:transparent;color:var(--film-silver);border:1px solid rgba(200,192,180,0.3)">
            Annuller
          </button>
        </div>
      </div>
    </div>

  </div><!-- end #app -->


  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="index.js"></script>
</body>

</html>
