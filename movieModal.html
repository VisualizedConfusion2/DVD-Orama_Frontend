<!-- Movie Modal -->
<div class="modal fade" id="movieModal" tabindex="-1" role="dialog" aria-labelledby="movieModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content" style="background-color:#1a0a0a; border:1px solid #c9a84c; color:#f0e8d5;">
            <div class="modal-header" style="border-bottom:1px solid rgba(201,168,76,0.3);">
                <h5 class="modal-title" id="movieModalLabel"
                    style="font-family:'Josefin Sans',sans-serif; letter-spacing:0.15em; text-transform:uppercase; color:#c9a84c;">
                    Movie Details
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="color:#c9a84c; opacity:1;">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body" style="font-family:'Cormorant Garamond',serif; font-size:1.1rem;">
                <div class="poster-container" onclick="openTrailerModal()" title="Click to watch trailer">
                    <img id="modal-poster-img" src="" alt="" width="120" style="display:none;" />
                    <div class="poster-play-overlay">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="40" height="40">
                            <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.6)"/>
                            <polygon points="10,8 18,12 10,16" fill="#c9a84c"/>
                        </svg>
                        <span>Watch Trailer</span>
                    </div>
                </div>
                <p><strong style="color:#c9a84c;">Title:</strong> <span id="modal-title"></span></p>
                <p><strong style="color:#c9a84c;">Release Year:</strong> <span id="modal-year"></span></p>
                <p><strong style="color:#c9a84c;">Duration:</strong> <span id="modal-duration"></span> minutes</p>
                <div style="margin-top:1rem;">
                    <strong style="color:#c9a84c;">Available On:</strong>
                    <ul id="modal-streaming-list" style="list-style:none; padding:0; margin-top:0.5rem;"></ul>
                    <strong style="color:#c9a84c; margin-top:1rem; display:block;">Actors:</strong>
                    <ul id="modal-actors-list" style="list-style:none; padding:0; margin-top:0.5rem;"></ul>
                </div>
            </div>
            <div class="modal-footer" style="border-top:1px solid rgba(201,168,76,0.3);">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Trailer Modal -->
<div class="modal fade" id="trailerModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content" style="background-color:#1a0a0a; border:1px solid #c9a84c;">
            <div class="modal-header" style="border-bottom:1px solid rgba(201,168,76,0.3);">
                <h5 class="modal-title"
                    style="font-family:'Josefin Sans',sans-serif; letter-spacing:0.15em; text-transform:uppercase; color:#c9a84c;">
                    Trailer
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="color:#c9a84c; opacity:1;">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body" style="padding:0;">
                <p id="trailer-loading" style="color:rgba(201,168,76,0.5); font-style:italic; padding:1rem;">Loading trailer...</p>
                <iframe id="trailer-iframe" width="100%" height="400" frameborder="0" allowfullscreen style="display:none;"></iframe>
                <p id="trailer-not-found" style="display:none; color:rgba(201,168,76,0.5); font-style:italic; padding:1rem;">No trailer found.</p>
            </div>
        </div>
    </div>
</div>
